<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ma Formation – ARCADINS Training Center</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <style>
    .formation-layout { display:grid; grid-template-columns:300px 1fr; gap:0; min-height:calc(100vh - 60px); }
    .sidebar { background:var(--blue-dark); color:white; padding:28px 20px; overflow-y:auto; }
    .sidebar h3 { font-size:.95rem; font-weight:700; margin-bottom:20px; opacity:.8; }
    .module-item { display:flex; align-items:center; gap:12px; padding:10px 14px; border-radius:10px; margin-bottom:8px; cursor:pointer; transition:.25s; }
    .module-item:hover { background:rgba(255,255,255,.08); }
    .module-item.active { background:rgba(255,255,255,.15); }
    .module-item.locked { opacity:.35; cursor:not-allowed; }
    .module-num { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.8rem; font-weight:700; flex-shrink:0; }
    .status-not_started .module-num { background:rgba(255,255,255,.15); }
    .status-in_progress .module-num { background:var(--gold); color:var(--blue-dark); }
    .status-completed .module-num { background:#4caf50; color:white; }
    .status-locked .module-num { background:rgba(255,255,255,.08); }
    .module-info { flex:1; }
    .module-name { font-size:.83rem; font-weight:600; }
    .module-status-label { font-size:.7rem; opacity:.6; }
    .status-completed .module-status-label { color:#a5d6a7; opacity:1; }
    .main-content { background:#f8fafc; padding:40px; overflow-y:auto; }
    .progress-header { background:white; border-radius:16px; padding:24px 28px; margin-bottom:28px; box-shadow:var(--shadow); }
    .progress-bar-wrap { margin-top:16px; }
    .progress-bar { height:10px; background:#e0e6f0; border-radius:5px; overflow:hidden; }
    .progress-fill { height:100%; background:linear-gradient(90deg,var(--blue),var(--gold)); border-radius:5px; transition:.5s; }
    .progress-stats { display:flex; gap:24px; margin-top:12px; flex-wrap:wrap; }
    .progress-stat { font-size:.82rem; color:var(--gray-text); }
    .progress-stat strong { color:var(--blue-dark); }
    .module-content { background:white; border-radius:16px; padding:36px; box-shadow:var(--shadow); }
    .module-content h2 { font-size:1.5rem; font-weight:800; color:var(--blue-dark); margin-bottom:8px; }
    .module-content .module-desc { color:var(--gray-text); margin-bottom:24px; line-height:1.7; }
    .content-blocks { display:flex; flex-direction:column; gap:20px; margin-bottom:32px; }
    .content-block { background:var(--gray-light); border-radius:12px; padding:20px 24px; }
    .content-block h4 { color:var(--blue-dark); margin-bottom:10px; }
    .content-block p { color:var(--gray-text); font-size:.9rem; line-height:1.6; margin:0; }
    .cmp-wrap { overflow-x:auto; margin-top:14px; -webkit-overflow-scrolling:touch; }
    .cmp-table { width:100%; border-collapse:collapse; font-size:.86rem; min-width:520px; background:white; border-radius:10px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.06); }
    .cmp-table th, .cmp-table td { padding:11px 14px; text-align:left; border-bottom:1px solid #eef1f6; vertical-align:top; }
    .cmp-table thead th { background:var(--blue-dark); color:white; font-weight:700; font-size:.82rem; }
    .cmp-table thead th:first-child { background:var(--blue-dark); }
    .cmp-table tbody td:first-child { font-weight:700; color:var(--blue-dark); background:#f7f9fc; white-space:nowrap; }
    .cmp-table tbody tr:last-child td { border-bottom:none; }
    .cmp-table .cmp-tef { color:#1565c0; }
    .cmp-table .cmp-tcf { color:#2e7d32; }
    .quiz-mini { background:linear-gradient(135deg,var(--blue),var(--blue-dark)); border-radius:14px; padding:24px; color:white; }
    .quiz-mini h4 { margin-bottom:16px; }
    .mini-q { margin-bottom:16px; }
    .mini-q p { margin-bottom:10px; font-size:.9rem; }
    .mini-opts { display:flex; flex-direction:column; gap:8px; }
    .mini-opt { background:rgba(255,255,255,.12); border:1.5px solid rgba(255,255,255,.2); border-radius:8px; padding:9px 14px; cursor:pointer; font-size:.85rem; transition:.2s; text-align:left; font-family:inherit; color:white; }
    .mini-opt:hover { background:rgba(255,255,255,.2); }
    .mini-opt.selected { background:rgba(255,255,255,.25); border-color:var(--gold); }
    .locked-overlay { text-align:center; padding:80px 40px; }
    .locked-overlay .lock-icon { font-size:4rem; margin-bottom:20px; }
    .completed-badge { display:inline-flex; align-items:center; gap:8px; background:#e8f5e9; color:#2e7d32; border-radius:20px; padding:8px 20px; font-size:.88rem; font-weight:700; margin-bottom:20px; }
    /* Test de module */
    .test-panel { background:white; border-radius:16px; box-shadow:var(--shadow); overflow:hidden; margin-top:24px; }
    .test-header { background:linear-gradient(135deg,var(--blue-dark),var(--blue)); color:white; padding:24px 32px; }
    .test-header h3 { margin:0 0 4px; font-size:1.2rem; }
    .test-header p { margin:0; opacity:.8; font-size:.85rem; }
    .test-body { padding:32px; }
    .test-question { margin-bottom:28px; }
    .test-question p.q-text { font-weight:700; color:var(--blue-dark); margin-bottom:12px; font-size:.95rem; }
    .test-options { display:flex; flex-direction:column; gap:8px; }
    .test-opt { background:var(--gray-light); border:2px solid transparent; border-radius:10px; padding:11px 16px; cursor:pointer; font-size:.88rem; transition:.2s; text-align:left; font-family:inherit; color:var(--text); width:100%; }
    .test-opt:hover:not(:disabled) { border-color:var(--blue); background:#eef3ff; }
    .test-opt.selected { border-color:var(--blue); background:#eef3ff; font-weight:600; }
    .test-opt.correct { border-color:#4caf50; background:#e8f5e9; color:#2e7d32; font-weight:700; }
    .test-opt.wrong { border-color:#f44336; background:#ffebee; color:#c62828; }
    .test-result-bar { border-radius:14px; padding:20px 24px; text-align:center; font-weight:700; font-size:1.05rem; }
    .test-result-bar.pass { background:#e8f5e9; color:#2e7d32; }
    .test-result-bar.fail { background:#ffebee; color:#c62828; }
    .test-explanation { background:#fff8e1; border-left:4px solid #f9a825; border-radius:6px; padding:10px 14px; margin-top:10px; font-size:.83rem; color:#5d4037; line-height:1.5; }
    /* Zone de pratique EO/EE */
    .practice-zone { background:white; border-radius:16px; box-shadow:var(--shadow); overflow:hidden; margin-bottom:20px; }
    .practice-zone-header { background:linear-gradient(135deg,#0b5d3b,#157a50); color:white; padding:20px 28px; }
    .practice-zone-header h3 { margin:0 0 4px; font-size:1.05rem; }
    .practice-zone-header p { margin:0; opacity:.8; font-size:.82rem; }
    .practice-zone-body { padding:24px 28px; }
    .practice-prompt { background:#f0f7f4; border-left:4px solid #0b5d3b; border-radius:8px; padding:14px 18px; margin-bottom:16px; font-size:.88rem; color:#1a3a2a; line-height:1.6; }
    .practice-textarea { width:100%; min-height:160px; border:2px solid #d0dae8; border-radius:10px; padding:14px; font-family:inherit; font-size:.88rem; line-height:1.6; resize:vertical; outline:none; transition:.25s; }
    .practice-textarea:focus { border-color:#0b5d3b; }
    .practice-rubric { margin-top:16px; }
    .practice-rubric h4 { font-size:.85rem; font-weight:700; color:#0b5d3b; margin-bottom:10px; }
    .rubric-item { display:flex; align-items:flex-start; gap:10px; padding:8px 0; border-bottom:1px solid #f0f0f0; font-size:.83rem; }
    .rubric-item:last-child { border-bottom:none; }
    .rubric-check { width:20px; height:20px; border:2px solid #0b5d3b; border-radius:4px; cursor:pointer; flex-shrink:0; margin-top:1px; accent-color:#0b5d3b; }
    .rubric-label { color:var(--gray-text); line-height:1.4; }
    .practice-wordcount { font-size:.75rem; color:#aaa; text-align:right; margin-top:6px; }
    .oral-checklist { display:flex; flex-direction:column; gap:8px; }
    .test-timer { display:inline-flex; align-items:center; gap:8px; background:rgba(255,255,255,.15); border-radius:10px; padding:6px 14px; font-size:.88rem; font-weight:700; float:right; }
    .test-timer.urgent { background:#c62828; animation:pulse .8s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }
    /* Notes personnelles */
    .notes-zone { background:#fffdf0; border:1.5px solid #e8d87a; border-radius:12px; padding:16px 20px; margin-top:20px; }
    .notes-zone summary { font-size:.85rem; font-weight:700; color:#7a6a00; cursor:pointer; user-select:none; list-style:none; display:flex; align-items:center; gap:8px; }
    .notes-zone summary::before { content:'📝'; }
    .notes-zone summary::-webkit-details-marker { display:none; }
    .notes-textarea { width:100%; min-height:100px; border:1.5px solid #e0d070; border-radius:8px; padding:10px 12px; font-family:inherit; font-size:.84rem; line-height:1.6; resize:vertical; outline:none; background:#fffff8; margin-top:10px; transition:.2s; }
    .notes-textarea:focus { border-color:#b8a000; }
    .notes-saved { font-size:.73rem; color:#9a8800; margin-top:4px; height:16px; transition:.3s; }
    /* Audio placeholder CO */
    .audio-placeholder { background:linear-gradient(135deg,#e3f2fd,#e8eaf6); border:2px dashed #90caf9; border-radius:12px; padding:20px 24px; margin-bottom:16px; }
    .audio-placeholder h4 { color:#1565c0; margin:0 0 6px; font-size:.92rem; }
    .audio-placeholder p { color:#5472a3; font-size:.83rem; margin:0 0 12px; line-height:1.5; }
    .audio-script { background:white; border-radius:8px; padding:14px 16px; font-size:.83rem; color:#2a3a5a; line-height:1.7; border-left:3px solid #90caf9; }
    .audio-script strong { color:#1565c0; }
    @media(max-width:768px) { .formation-layout{grid-template-columns:1fr;} .sidebar{display:none;} .main-content{padding:20px;} .test-body{padding:20px;} }
  </style>
</head>
<body>
<nav style="background:var(--blue-dark);padding:0 24px;height:58px;display:flex;align-items:center;justify-content:space-between;">
  <a href="../index.html" class="logo"><img src="../assets/img/logo-nav.svg" alt="ARCADINS" height="42" style="display:block;filter:brightness(10);"></a>
  <div style="display:flex;align-items:center;gap:16px;">
    <span id="userDisplayName" style="color:white;font-size:.85rem;font-weight:600;"></span>
    <button id="langToggle" onclick="switchLang()" style="background:transparent;border:1.5px solid rgba(255,255,255,.4);color:white;border-radius:8px;padding:4px 12px;font-size:.78rem;font-weight:700;cursor:pointer;font-family:inherit;">🇬🇧 EN</button>
    <a href="espace-membre.html" style="color:rgba(255,255,255,.7);font-size:.82rem;" data-i18n="nav.dashboard">Mon espace</a>

</nav>

<div class="formation-layout">
  <!-- Sidebar modules -->
  <div class="sidebar" id="sidebar">
    <h3 data-i18n="form.sidebar.h">📚 Mes modules</h3>
    <div id="moduleList"></div>
  </div>

  <!-- Main content -->
  <div class="main-content">
    <div class="progress-header">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
        <div>
          <h2 style="font-size:1.2rem;font-weight:800;color:var(--blue-dark);margin:0;" data-i18n="form.progress.h">Ma progression</h2>
          <span id="userStepDisplay" style="font-size:.82rem;color:var(--gray-text);"></span>
        </div>
        <div id="completedBadge" style="display:none;" class="completed-badge">✅ <span data-i18n="form.all.done">Tous les modules terminés !</span></div>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
        <div class="progress-stats">
          <div class="progress-stat"><strong id="statDone">0</strong> / <span id="statTotal">14</span> <span data-i18n="form.stat.done">modules terminés</span></div>
          <div class="progress-stat"><strong id="statPct">0%</strong> <span data-i18n="form.stat.pct">complété</span></div>
        </div>
      </div>
    </div>

    <div class="module-content" id="moduleContent">
      <div style="text-align:center;padding:60px 0;">⏳ <span data-i18n="trial.loading">Chargement...</span></div>
    </div>

    <div id="allDonePanel" style="display:none;text-align:center;padding:40px;background:white;border-radius:16px;box-shadow:var(--shadow);">
      <div style="font-size:4rem;">🎉</div>
      <h2 style="color:var(--blue-dark);margin:16px 0 8px;" data-i18n="form.done.h">Formation complétée !</h2>
      <p style="color:var(--gray-text);margin-bottom:24px;" data-i18n="form.done.p">Félicitations ! Vous avez complété tous les modules. Vous êtes maintenant invité à passer le Test d'Évaluation Finale.</p>
      <a href="test-final.html" class="btn-primary" data-i18n="form.done.btn">Passer le test final →</a>
    </div>
  </div>
</div>

<script>
const MODULE_NAMES = {
  fr: [
    'Introduction au TEF & TCF Canada',
    'Compréhension orale – Niveau 1',
    'Expression orale – Niveau 1',
    'Compréhension écrite – Niveau 1',
    'Expression écrite – Niveau 1',
    'Grammaire essentielle',
    'Vocabulaire thématique',
    'Compréhension orale – Niveau 2',
    'Expression orale – Niveau 2',
    'Compréhension écrite – Niveau 2',
    'Expression écrite – Niveau 2',
    'Techniques d\'examen',
    'Simulations et examens blancs',
    'Révision générale et stratégies finales'
  ],
  en: [
    'Introduction to TEF & TCF Canada',
    'Listening Comprehension – Level 1',
    'Oral Expression – Level 1',
    'Reading Comprehension – Level 1',
    'Written Expression – Level 1',
    'Essential Grammar',
    'Thematic Vocabulary',
    'Listening Comprehension – Level 2',
    'Oral Expression – Level 2',
    'Reading Comprehension – Level 2',
    'Written Expression – Level 2',
    'Exam Techniques',
    'Simulations & Mock Exams',
    'General Review & Final Strategies'
  ]
};
const MODULE_ICONS = ['📊','🎧','📖','✍️','🎤','📝','🗣️','🎯','⏱️','📋','✅','📈','🏆','👨‍🏫'];
const MODULE_CONTENT = {
  fr: [
    // Module 1 — Introduction au TEF & TCF Canada
    { desc:'Comprenez le fonctionnement des examens et évaluez votre niveau de départ.', blocks:[
      {h:'📊 Objectifs pédagogiques',p:'Ce module fondateur vous permet de comprendre le fonctionnement du TEF Canada et du TCF Canada, d\'établir votre profil NCLC de départ et de planifier votre parcours de formation selon votre objectif d\'immigration.'},
      {h:'🎯 Les 4 compétences évaluées',p:'Le TEF & TCF Canada évalue 4 compétences : <strong>Compréhension Orale (CO)</strong>, <strong>Compréhension Écrite (CE)</strong>, <strong>Expression Orale (EO)</strong> et <strong>Expression Écrite (EE)</strong>. Chaque compétence donne un score NCLC de 1 à 12.'},
      {h:'📋 NCLC vs CECRL — Correspondances clés',p:'NCLC 4 ≈ A2 · NCLC 5-6 ≈ B1 · NCLC 7 ≈ B2 · NCLC 8 ≈ B2+ · NCLC 9 ≈ C1 · NCLC 10-12 ≈ C2. Pour Express Entry, le bonus de langue commence à NCLC 7 et est maximal à NCLC 9+.'},
      {h:'🏛️ TEF Canada vs TCF Canada — Fiche comparative',p:'Les deux examens sont <strong>reconnus par IRCC</strong> et évaluent les <strong>mêmes 4 compétences</strong> aux <strong>mêmes niveaux NCLC</strong>. Vous passez <strong>l\'un OU l\'autre</strong>, jamais les deux. Seuls le format et le barème diffèrent :',
        table:`<div class="cmp-wrap"><table class="cmp-table">
          <thead><tr><th>Critère</th><th class="cmp-tef">🔵 TEF Canada</th><th class="cmp-tcf">🟢 TCF Canada</th></tr></thead>
          <tbody>
            <tr><td>Organisme</td><td>CCIP (Chambre de Commerce de Paris)</td><td>France Éducation International</td></tr>
            <tr><td>Notation</td><td>Score en points (ex. 0–450 par épreuve)</td><td>Niveaux A1 → C2</td></tr>
            <tr><td>Compétences</td><td>CO · CE · EO · EE</td><td>CO · CE · EO · EE</td></tr>
            <tr><td>Compréhension orale</td><td>~40 questions · ~40 min</td><td>~29 questions · ~35 min</td></tr>
            <tr><td>Compréhension écrite</td><td>~50 questions · ~60 min</td><td>~29 questions · ~60 min</td></tr>
            <tr><td>Expression écrite</td><td>2 tâches · ~60 min</td><td>3 tâches · ~60 min</td></tr>
            <tr><td>Expression orale</td><td>2 sections · ~15 min</td><td>2 tâches · ~12 min</td></tr>
            <tr><td>Validité résultats</td><td>2 ans</td><td>2 ans</td></tr>
            <tr><td>Reconnaissance IRCC</td><td>✅ Oui (Express Entry, PSTQ…)</td><td>✅ Oui (Express Entry, PSTQ…)</td></tr>
          </tbody></table></div>
          <p style="margin-top:12px;font-size:.85rem;color:var(--gray-text);">💡 <strong>Lequel choisir ?</strong> Les deux mènent au même résultat NCLC. Choisissez selon les <strong>centres d\'examen disponibles près de chez vous</strong> et les <strong>dates</strong>. Les chiffres ci-dessus sont indicatifs — vérifiez toujours le format à jour sur les sites officiels avant votre inscription.</p>`},
      {h:'⚠️ Pièges à éviter dès le départ',p:'Ne sous-estimez pas l\'expression orale — c\'est souvent la compétence la plus chronophage à améliorer. Ne visez pas uniquement NCLC 7 : passer de 7 à 9 peut ajouter plus de 50 points CRS. Prévoyez au minimum 8 à 12 semaines de préparation sérieuse.'},
      {h:'🗓️ Conseils d\'organisation',p:'Planifiez votre formation sur 8 à 14 semaines. Allouez 45 à 60 minutes par jour, 5 jours par semaine. Commencez par identifier vos 2 compétences les plus faibles et y consacrez 60 % de votre temps d\'entraînement.'}
    ]},
    // Module 2 — Compréhension Orale Niveau 1
    { desc:'Développez vos stratégies d\'écoute et maîtrisez les types de documents sonores.', blocks:[
      {h:'🎧 Compétences visées',p:'Ce module cible les niveaux NCLC 5 à 7 (B1-B2) en compréhension orale. Vous apprendrez à identifier les informations essentielles dans des conversations courantes, des annonces publiques et des bulletins d\'information.'},
      {h:'📻 Types de documents au TEF & TCF Canada',p:'<strong>Dialogues</strong> (collègues, voisins, client/vendeur) · <strong>Annonces</strong> (transports, lieux publics) · <strong>Bulletins météo</strong> · <strong>Messages téléphoniques</strong> · <strong>Émissions de radio courtes</strong>. Niveau : A2 à B2 pour ce module.'},
      {h:'🔑 Stratégie : les 3 écoutes mentales',p:'<strong>1ère écoute</strong> : identifiez le contexte (qui parle ? où ? de quoi ?). <strong>2ème écoute</strong> : repérez les informations demandées par les questions. <strong>Pendant l\'écoute</strong> : ne transcrivez pas tout — notez seulement les mots-clés, chiffres et noms propres.'},
      {h:'⚙️ Gestion du temps — Technique essentielle',p:'Lisez les questions AVANT l\'écoute (pendant le temps accordé). Répondez EN écoutant, pas après. Si vous ratez une réponse, passez à la suivante — ne bloquez jamais. Utilisez les 8-10 secondes entre chaque question pour relire la suivante.'},
      {h:'🇨🇦 Accent québécois — Spécificités',p:'Le TCF Canada peut inclure des locuteurs avec un accent québécois. Caractéristiques : diphtongues (moi → "moé"), affrication (ti, di), vocabulaire spécifique (char = voiture, dépanneur = épicerie, courriel = email). Exposez-vous régulièrement à Radio-Canada et à l\'émission Tout le monde en parle.'},
      {h:'📝 Mémo — 5 points à retenir',p:'① Lisez toujours les questions avant d\'écouter ② Ciblez les mots-clés, pas les détails ③ Ne bloquez pas sur une question manquée ④ Les pièges sont souvent dans les détails numériques (dates, heures, prix) ⑤ L\'accent québécois n\'est pas une erreur — c\'est du français authentique.'}
    ]},
    // Module 3 — Expression Orale Niveau 1
    { desc:'Structurez vos interventions orales et développez votre aisance à l\'expression.', blocks:[
      {h:'🎤 Compétences visées',p:'Ce module prépare aux épreuves orales de niveau NCLC 5 à 7 (B1-B2) : interaction guidée (jeu de rôle), monologue préparé et questions-réponses courtes sur des sujets du quotidien.'},
      {h:'🗺️ Structure d\'une réponse orale efficace',p:'Toute réponse orale doit suivre la structure <strong>IMC</strong> : <strong>Introduction</strong> (annoncez votre point de vue en 1-2 phrases), <strong>Message</strong> (développez avec 2 arguments + exemples), <strong>Conclusion</strong> (résumez en 1 phrase). Même pour une réponse de 2 minutes.'},
      {h:'🔗 Connecteurs oraux indispensables (niveau B1-B2)',p:'<strong>Introduction</strong> : « Je vais vous parler de… », « Ce sujet me tient à cœur car… » · <strong>Addition</strong> : « De plus », « Par ailleurs », « En outre » · <strong>Opposition</strong> : « Cependant », « Néanmoins » · <strong>Conclusion</strong> : « En résumé », « Pour conclure », « En définitive ».'},
      {h:'🎙️ Les pièges classiques de l\'épreuve orale',p:'① Ne pas répondre à la question posée (hors sujet) ② Parler trop vite par stress → erreurs de prononciation ③ Répéter les mêmes mots (utiliser des synonymes) ④ S\'arrêter et dire « Euh... je sais pas » — mieux vaut reformuler ⑤ Ignorer la structure intro/développement/conclusion.'},
      {h:'💬 Situations de communication fréquentes',p:'<strong>Vie quotidienne</strong> : logement, transports, achats, rendez-vous médicaux. <strong>Travail</strong> : entretien d\'embauche, réunion, demande de congé. <strong>Immigration</strong> : expliquer son projet, décrire son parcours. Entraînez-vous sur ces scénarios régulièrement.'},
      {h:'📝 Mémo — Formules utiles à mémoriser',p:'« À mon avis… » · « Il me semble que… » · « Je suis convaincu(e) que… » · « Certes… mais… » · « Il convient de préciser que… » · « En ce qui me concerne… » · « Pour étayer mon propos… » · « En guise de conclusion… »'}
    ]},
    // Module 4 — Compréhension Écrite Niveau 1
    { desc:'Maîtrisez la lecture de textes courants et développez votre vocabulaire fonctionnel.', blocks:[
      {h:'📖 Compétences visées',p:'Ce module cible NCLC 5 à 7 (B1-B2) en compréhension écrite. Vous apprendrez à lire et comprendre des textes courants : publicités, messages, modes d\'emploi, articles de presse courts, formulaires administratifs.'},
      {h:'📄 Types de textes — Niveau 1',p:'<strong>Textes fonctionnels</strong> : petites annonces, menus, horaires, affiches · <strong>Textes informatifs courts</strong> : articles de blog, FAQ, brochures · <strong>Messages et courriels</strong> informels · <strong>Formulaires simples</strong> : demande de logement, inscription. Chaque type a sa propre stratégie de lecture.'},
      {h:'⚡ Techniques de lecture rapide',p:'<strong>Skimming</strong> (survol) : parcourez le texte en 30 secondes pour en saisir le thème général. <strong>Scanning</strong> (balayage) : recherchez un mot, une date, un chiffre précis. <strong>Lecture sélective</strong> : ne lisez en détail que les paragraphes liés aux questions. Ne lisez JAMAIS tout mot à mot au TEF/TCF.'},
      {h:'🇨🇦 Vocabulaire canadien — Termes essentiels',p:'<strong>Administration</strong> : NAS (numéro d\'assurance sociale), T4 (relevé d\'emploi), CPE (centre de la petite enfance), CLSC (centre de santé communautaire). <strong>Vie quotidienne</strong> : dépanneur, autobus (pas "bus"), courriel (pas "email"), stationnement (pas "parking"), magasinage (pas "shopping").'},
      {h:'⚠️ Pièges fréquents en CE',p:'① Choisir la réponse qui contient des mots du texte sans avoir vraiment compris ② Confondre une information affirmée et une information niée ③ Ignorer les nuances (« parfois », « rarement », « il arrive que ») ④ Répondre d\'après ses propres connaissances et non d\'après le texte.'},
      {h:'📝 Mémo — Stratégie en 4 étapes',p:'<strong>Étape 1</strong> : lisez les questions (30 sec) · <strong>Étape 2</strong> : identifiez le type de texte · <strong>Étape 3</strong> : lisez le texte en ciblant les réponses · <strong>Étape 4</strong> : relisez les questions et vérifiez. Budget temps : 1,5 minute par question maximum.'}
    ]},
    // Module 5 — Expression Écrite Niveau 1
    { desc:'Rédigez des textes formels structurés adaptés aux exigences du TEF & TCF Canada.', blocks:[
      {h:'✍️ Compétences visées',p:'Ce module prépare à la Tâche 1 de l\'expression écrite (lettre/courriel formel, 120-150 mots) et introduit les bases de la Tâche 2. Niveau cible : NCLC 5 à 7 (B1-B2).'},
      {h:'📧 Structure d\'un courriel formel — Guide complet',p:'<strong>1. Objet</strong> : résumer en 5-8 mots (« Demande de renseignements — Inscription au programme ») <strong>2. Salutation</strong> : « Madame, » ou « Monsieur, » (avec virgule) <strong>3. Corps</strong> : introduction → développement → demande ou conclusion <strong>4. Formule de politesse</strong> : « Veuillez agréer, Madame, l\'expression de mes salutations distinguées. » <strong>5. Signature</strong>.'},
      {h:'🔑 Vocabulaire de la politesse épistolaire',p:'<strong>Ouverture</strong> : « J\'ai l\'honneur de vous soumettre… », « Suite à notre entretien téléphonique… », « Je me permets de… » · <strong>Corps</strong> : « Je souhaiterais obtenir des informations concernant… », « Pourriez-vous me faire parvenir… » · <strong>Clôture</strong> : « Dans l\'attente de votre réponse, je demeure à votre disposition. »'},
      {h:'⚠️ Les 10 erreurs les plus pénalisantes',p:'① Utiliser « tu » au lieu de « vous » ② Oublier la formule de politesse finale ③ Dépasser ou ne pas atteindre le nombre de mots ④ Anglicismes (« canceller » → annuler, « meeting » → réunion) ⑤ Répétition du mot « je » en début de phrases consécutives ⑥ Absence de connecteurs logiques ⑦ Confusion sur/sous (sur rendez-vous ≠ sous rendez-vous) ⑧ « Suite à » ≠ « Faites suite à » ⑨ Pas d\'objet précis ⑩ Formule de salutation déséquilibrée.'},
      {h:'📊 Grille d\'évaluation officielle',p:'L\'expression écrite est notée selon 4 critères : <strong>Adéquation à la tâche</strong> (réponse aux consignes) · <strong>Cohérence et cohésion</strong> (logique et connecteurs) · <strong>Compétence lexicale</strong> (vocabulaire varié, précis) · <strong>Compétence grammaticale</strong> (exactitude morphosyntaxique). Chaque critère pèse ~25 % de la note.'},
      {h:'📝 Mémo — Checklist avant de rendre votre copie',p:'✓ J\'ai respecté le nombre de mots (120-150) ✓ J\'ai utilisé le « vous » formel ✓ Ma formule de politesse est complète ✓ J\'ai utilisé au moins 4 connecteurs différents ✓ J\'ai répondu à toutes les consignes ✓ J\'ai relu pour les accords et conjugaisons'}
    ]},
    // Module 6 — Grammaire Essentielle
    { desc:'Maîtrisez les structures grammaticales fondamentales du français pour le TEF & TCF Canada.', blocks:[
      {h:'📚 Prérequis et objectifs',p:'Ce module consolide les bases grammaticales indispensables pour atteindre NCLC 6 à 8. Nous traitons en priorité les structures les plus fréquemment testées et les plus souvent mal maîtrisées par les candidats.'},
      {h:'⚙️ Les temps essentiels — Révision ciblée',p:'<strong>Passé composé</strong> : être ou avoir ? + accords · <strong>Imparfait</strong> : habitudes, descriptions, circonstances · <strong>Futur simple</strong> : radical irrégulier (ir-, aur-, saur-, ferr-, viendr-) · <strong>Conditionnel</strong> : politesse + hypothèse (si + imparfait → conditionnel) · <strong>Subjonctif</strong> : après il faut que, bien que, pour que, douter que.'},
      {h:'🔴 Les 15 erreurs les plus pénalisées au TEF & TCF',p:'① Accord du participe passé avec avoir (COD antéposé) ② « Malgré que » (fautif → « bien que ») ③ Subjonctif après « espérer que » (non — indicatif) ④ « Si » + conditionnel (jamais !) ⑤ Confusion « ce » / « se » ⑥ Confusion « a » / « à » ⑦ « Leur » invariable comme pronom (leur dire ≠ leurs) ⑧ Participe présent vs gérondif ⑨ Négation mal placée au passé composé ⑩ Accord de l\'adjectif avec le nom le plus proche (faux).'},
      {h:'💡 Méthode de mémorisation des irrégularités',p:'Regroupez les verbes irréguliers par familles : <strong>Famille -dre</strong> (prendre, apprendre, comprendre) → même conjugaison. <strong>Famille -ir type 2</strong> (partir, sortir, mentir) → je pars, tu pars, il part. <strong>Auxiliaires</strong> être/avoir à tous les temps : mémorisez-les absolument en priorité.'},
      {h:'📋 Le subjonctif — Tableau des déclencheurs',p:'<strong>Obligation</strong> : il faut que, il est nécessaire que, il est essentiel que · <strong>Émotion</strong> : je suis content que, je regrette que, il est dommage que · <strong>Doute/Possibilité</strong> : il est possible que, je doute que, je ne crois pas que · <strong>Concession</strong> : bien que, quoique, encore que · <strong>But</strong> : pour que, afin que · <strong>Condition</strong> : à condition que, pourvu que.'},
      {h:'📝 Mémo — 5 règles d\'or de la grammaire française',p:'① Le COD antéposé avec avoir → accord obligatoire ② Si + imparfait → conditionnel présent (JAMAIS si + conditionnel) ③ Bien que, quoique, pour que → TOUJOURS subjonctif ④ Après espérer, croire, penser (affirmatif) → indicatif ⑤ Le gérondif (en + participe présent) = même sujet que le verbe principal'}
    ]},
    // Module 7 — Vocabulaire Thématique
    { desc:'Enrichissez votre vocabulaire dans les domaines de l\'immigration, du travail et de la vie canadienne.', blocks:[
      {h:'🗺️ Vocabulaire de l\'immigration — Niveau avancé',p:'<strong>Procédures</strong> : déposer/constituer un dossier · soumettre une demande · obtenir une invitation (ITD) · se conformer aux exigences · rencontrer les critères d\'admissibilité · faire valoir ses droits · interjeter appel. <strong>Documents</strong> : acte de naissance apostillé · extrait de casier judiciaire · évaluation des diplômes étrangers (EDE).'},
      {h:'💼 Vocabulaire professionnel — Contexte canadien',p:'<strong>CV canadien</strong> : compétences transférables, accomplissements quantifiés, références professionnelles · <strong>Entretien</strong> : mettre en valeur son expérience, démontrer sa valeur ajoutée, négocier sa rémunération · <strong>Milieu de travail</strong> : faire du bénévolat (volunteering), effectuer du télétravail (remote work), bénéficier d\'avantages sociaux.'},
      {h:'🏥 Vocabulaire — Santé et services sociaux',p:'Carte d\'assurance maladie (RAMQ au Québec) · médecin de famille / omnipraticien · CLSC (centre de santé communautaire) · liste d\'attente · soins d\'urgence (urgence vs salle d\'urgence) · prescription / ordonnance · médicaments génériques · assurance médicaments complémentaire.'},
      {h:'🏠 Vocabulaire — Logement au Canada',p:'Appartement / logement / loyer · bail (contrat de location, généralement 12 mois) · Régie du logement (Tribunal administratif du logement au Québec) · dépôt de garantie (caution) · charges incluses / non comprises · condo vs coopérative d\'habitation · inspection pré-achat · hypothèque / mise de fonds.'},
      {h:'🎓 Vocabulaire — Éducation et formation',p:'Cégep (collège d\'enseignement général et professionnel — uniquement au Québec) · AEC (Attestation d\'Études Collégiales) · DEC (Diplôme d\'Études Collégiales) · DEP (Diplôme d\'Études Professionnelles) · équivalence de diplôme · reconnaissance des acquis (RAC) · formation continue · bourse d\'études.'},
      {h:'📝 Mémo — 30 verbes utiles pour le TEF & TCF',p:'Solliciter · octroyer · soumettre · valider · attester · justifier · accréditer · mandater · renouveler · prolonger · résilier · annuler · reporter · confirmer · notifier · aviser · informer · renseigner · consulter · se conformer · bénéficier · s\'acquitter · acquiescer · contester · interjeter · revendiquer · exercer ses droits · faire valoir · prendre acte · donner suite.'}
    ]},
    // Module 8 — Compréhension Orale Niveau 2
    { desc:'Maîtrisez l\'écoute de documents complexes et atteignez les niveaux NCLC 8 à 10.', blocks:[
      {h:'🎧 Compétences visées',p:'Ce module cible les niveaux NCLC 8 à 10 (B2+ à C1). Vous apprendrez à comprendre des documents sonores complexes : débats, conférences, émissions thématiques, entretiens d\'experts et reportages journalistiques.'},
      {h:'📡 Types de documents — Niveau avancé',p:'<strong>Interviews et entretiens</strong> (experts, chercheurs, personnalités publiques) · <strong>Débats et tables rondes</strong> (plusieurs voix, opinions contradictoires) · <strong>Reportages journalistiques</strong> (Radio-Canada, Le Devoir en ligne) · <strong>Conférences et exposés</strong> (registre académique). Durée : 1 min 30 à 3 minutes.'},
      {h:'🔬 Stratégies d\'écoute avancées',p:'① Identifiez le registre (formel, familier, soutenu) dès les premières secondes ② Distinguez faits, opinions et hypothèses ③ Repérez l\'implicite et les sous-entendus ④ Prêtez attention aux marqueurs d\'atténuation (« il semblerait que », « selon certains ») ⑤ Notez les chiffres, dates et données statistiques mentionnés.'},
      {h:'🇨🇦 Contexte québécois — Expressions avancées',p:'<strong>Médias québécois à écouter</strong> : Radio-Canada (ICI Première), CIBL 101.5 FM, Cogeco Nouvelles · <strong>Expressions courantes</strong> : « C\'est le boutte » (c\'est super), « pogner » (attraper/devenir populaire), « pantoute » (pas du tout), « maganer » (abîmer) · Ces expressions apparaissent rarement à l\'examen mais enrichissent votre compréhension culturelle.'},
      {h:'⚠️ Pièges des documents longs',p:'① Les premières informations ne sont pas toujours les plus importantes — restez attentif jusqu\'à la fin ② Un locuteur peut citer un point de vue qu\'il ne partage pas lui-même ③ Les comparaisons (plus/moins que) sont souvent testées ④ La conclusion d\'un débat est différente des opinions des participants ⑤ Les chiffres sont souvent modifiés légèrement dans les distracteurs.'},
      {h:'📝 Plan de progression — Niveau 2',p:'Semaine 1-2 : écoutes quotidiennes de 15 min (Radio-Canada) sans sous-titres · Semaine 3-4 : exercices avec transcription — comparez votre compréhension à la transcription · Semaine 5-6 : simulations chronométrées sur des documents de 2-3 min · Objectif : 85 % de bonnes réponses sur des documents B2+ avant de passer au module suivant.'}
    ]},
    // Module 9 — Expression Orale Niveau 2
    { desc:'Atteignez l\'excellence orale avec des arguments structurés de niveau C1.', blocks:[
      {h:'🎤 Compétences visées',p:'Ce module prépare aux épreuves orales de niveau NCLC 8 à 10 (B2+-C1) : argumentation développée, débat contradictoire, prise de position nuancée et interaction avec un examinateur.'},
      {h:'🏛️ Structure d\'une argumentation de niveau C1',p:'<strong>Introduction</strong> (30 sec) : reformulez le sujet + annoncez votre plan · <strong>Thèse</strong> (1 min) : argument principal + exemple concret · <strong>Antithèse</strong> (1 min) : argument adverse + réfutation · <strong>Synthèse</strong> (30 sec) : position nuancée + ouverture · <strong>Conclusion</strong> (15 sec) : phrase d\'impact mémorable.'},
      {h:'💎 Vocabulaire de haut registre — NCLC 9-10',p:'<strong>Pour affirmer</strong> : « Force est de constater que... » · « Il est indéniable que... » · « Il convient de souligner que... » · <strong>Pour nuancer</strong> : « Certes... mais il n\'en demeure pas moins que... » · « Il serait réducteur de prétendre que... » · <strong>Pour conclure</strong> : « En définitive... » · « Au final, il appert que... »'},
      {h:'🔄 La concession — Technique avancée',p:'La concession est le marqueur de maturité intellectuelle le plus valorisé à l\'oral. Structure : <strong>« Certes + [argument adverse reconnu], mais/cependant + [réfutation ou nuance] »</strong>. Exemple : « Certes, l\'immigration crée des défis d\'intégration, mais force est de constater que sa contribution économique dépasse largement ces difficultés. »'},
      {h:'🎙️ Gestion des imprévus à l\'oral',p:'Si vous ne comprenez pas la question : « Pourriez-vous reformuler votre question ? » / « Si j\'ai bien compris, vous me demandez de... » · Si vous cherchez vos mots : « Comment dire... » / « Le terme qui me vient est... » / « Pour m\'exprimer autrement... » · Évitez absolument : « Je ne sais pas », les silences longs, les répétitions en boucle.'},
      {h:'📝 Mémo — Sujets fréquents à l\'oral TEF/TCF',p:'Immigration et intégration · Bilinguisme et langues officielles · Travail à distance et nouvelles technologies · Environnement et développement durable · Système éducatif québécois/canadien · Santé publique · Réseaux sociaux · Égalité des chances · Vieillissement de la population · Mondialisation et identité culturelle.'}
    ]},
    // Module 10 — Compréhension Écrite Niveau 2
    { desc:'Analysez des textes complexes et développez votre compréhension en profondeur.', blocks:[
      {h:'📖 Compétences visées',p:'Ce module cible NCLC 8 à 10 (B2+ à C1) en compréhension écrite. Vous apprendrez à analyser des textes complexes : articles de fond, éditoriaux, textes académiques, documents légaux et administratifs.'},
      {h:'📰 Types de textes — Niveau avancé',p:'<strong>Articles d\'opinion et éditoriaux</strong> · <strong>Textes académiques et scientifiques</strong> · <strong>Documents juridiques simplifiés</strong> (contrats, baux) · <strong>Textes argumentatifs complexes</strong> · <strong>Documents officiels IRCC</strong> (guides, politiques). Ces textes exigent une lecture analytique et non linéaire.'},
      {h:'🔬 Lecture analytique — 5 étapes',p:'① <strong>Identification</strong> : type de texte, auteur, source, date · ② <strong>Thèse</strong> : quelle est la position défendue ? · ③ <strong>Arguments</strong> : quels sont les 2-3 arguments principaux ? · ④ <strong>Implicite</strong> : ce qui est suggéré sans être dit explicitement · ⑤ <strong>Ton</strong> : formel/informel, neutre/engagé, objectif/subjectif.'},
      {h:'🧩 Vocabulaire des textes complexes',p:'<strong>Marqueurs d\'implicite</strong> : « il est à noter que », « il convient de rappeler que », « force est de constater que » · <strong>Atténuation</strong> : « il semblerait que », « selon certains », « il est permis de supposer » · <strong>Emphase</strong> : « c\'est précisément », « il ne fait aucun doute que », « il est indéniable que ».'},
      {h:'⚠️ Pièges des textes de niveau C1',p:'① Les questions testent souvent la compréhension de l\'implicite et des nuances, pas des informations explicites ② Méfiez-vous des distracteurs partiellement vrais ③ La source du texte indique souvent le registre attendu ④ Un texte argumentatif peut présenter des points de vue adverses sans les cautionner ⑤ « Selon l\'auteur » ≠ « selon des études » ≠ « selon le narrateur ».'},
      {h:'📝 Mémo — Vocabulaire des connecteurs de haut niveau',p:'<strong>Cause</strong> : attendu que, vu que, en raison de, du fait de · <strong>Conséquence</strong> : d\'où, c\'est pourquoi, il s\'ensuit que, il en résulte que · <strong>Concession</strong> : si tant est que, quand bien même, nonobstant, en dépit de · <strong>Addition</strong> : qui plus est, de surcroît, voire, a fortiori.'}
    ]},
    // Module 11 — Expression Écrite Niveau 2
    { desc:'Rédigez des textes argumentatifs de niveau C1 avec maîtrise et précision stylistique.', blocks:[
      {h:'✍️ Compétences visées',p:'Ce module prépare à la Tâche 2 de l\'expression écrite (200-250 mots, texte argumentatif) au niveau NCLC 8 à 10 (B2+-C1). Il vise la maîtrise stylistique, la richesse lexicale et la rigueur argumentative.'},
      {h:'📐 Structure avancée d\'un texte argumentatif',p:'<strong>Introduction</strong> : accroche (fait, question, citation) → contextualisation → thèse annoncée · <strong>Développement</strong> : ¶1 (argument 1 + exemple + mini-conclusion) · ¶2 (argument 2 + exemple + mini-conclusion) · ¶3 (concession + réfutation) · <strong>Conclusion</strong> : synthèse + ouverture.'},
      {h:'💎 Lexique soutenu — À intégrer dans vos productions',p:'<strong>Verbes académiques</strong> : démontrer, attester, corroborer, étayer, infirmer, nuancer, appréhender, préconiser · <strong>Substantifs</strong> : l\'enjeu, la problématique, la dichotomie, la dialectique, l\'approche holistique · <strong>Locutions</strong> : force est de constater, il appert que, à cet égard, dans cette optique, en l\'occurrence.'},
      {h:'🔴 Erreurs qui font chuter de NCLC 8 à NCLC 6',p:'① Répéter le même mot 3+ fois dans un paragraphe (utiliser des synonymes) ② Commencer plusieurs phrases consécutives par « Je » ③ Anglicismes non corrigés ④ Paragraphes déséquilibrés (1 phrase vs 10 phrases) ⑤ Absence de transition entre les paragraphes ⑥ Introduction trop longue et conclusion expédiée ⑦ Oublier de prendre une position claire.'},
      {h:'✅ Guide de révision en 3 passes',p:'<strong>Passe 1 — Fond</strong> : ai-je répondu à la consigne ? ma thèse est-elle claire ? ai-je 2-3 arguments étayés ? · <strong>Passe 2 — Forme</strong> : ai-je utilisé au moins 6 connecteurs différents ? ai-je varié le vocabulaire ? · <strong>Passe 3 — Langue</strong> : accords (participes, adjectifs), conjugaisons, ponctuation. Budget : 5 minutes de révision sur 60.'},
      {h:'📝 Mémo — Sujets fréquents à l\'écrit TEF/TCF',p:'Technologies et vie privée · Immigration et intégration · Écologie et modes de vie durables · L\'éducation à distance · Réseaux sociaux et jeunesse · Travail et épanouissement personnel · Mondialisation économique · Bilinguisme et identité · Santé publique et responsabilité individuelle · Les aînés dans la société contemporaine.'}
    ]},
    // Module 12 — Techniques d\'Examen
    { desc:'Maîtrisez les techniques de gestion du temps et des stratégies pour chaque épreuve.', blocks:[
      {h:'⏱️ Gestion du temps — Les 4 épreuves',p:'<strong>CO (~40 min)</strong> : 1-1,5 min/question → lisez avant, répondez pendant · <strong>CE (~60 min)</strong> : 90 sec/question → survol puis lecture ciblée · <strong>EE (~60 min)</strong> : 5 min planification + 45 min rédaction + 10 min révision · <strong>EO (~15 min)</strong> : 30-60 sec préparation + 2-4 min réponse.'},
      {h:'🧠 Psychologie de l\'examen — Rester performant',p:'① La veille : pas de révision intensive — activité légère, sommeil suffisant ② Le matin : petit-déjeuner protéiné, arriver 30 minutes à l\'avance ③ En salle : si vous bloquez sur une question, marquez-la et continuez ④ Ne revenez jamais sur une réponse sauf si vous avez une raison précise ⑤ Votre premier instinct est souvent le bon.'},
      {h:'🎯 Technique des 4 éliminations (QCM)',p:'Face à une question difficile : ① Éliminez les réponses clairement fausses (il en reste souvent 2) ② Repérez les réponses « presque vraies » (avec un mot faux) ③ Méfiez-vous des réponses qui paraissent trop évidentes ④ La réponse la plus précise et nuancée est souvent la bonne ⑤ Ne laissez JAMAIS une case vide — il n\'y a pas de pénalité pour une mauvaise réponse.'},
      {h:'📋 Checklist J-7 avant l\'examen',p:'✓ Pratiquer une simulation complète chronométrée ✓ Réviser les connecteurs logiques et formules épistolaires ✓ Revoir les erreurs récurrentes de grammaire ✓ Préparer 3-4 exemples concrets sur des sujets d\'opinion fréquents ✓ Confirmer l\'heure et le lieu de l\'examen ✓ Préparer les documents requis (pièce d\'identité, convocation).'},
      {h:'🔁 Plan de révision — Dernière semaine',p:'<strong>J-7 à J-5</strong> : simulation complète + correction approfondie · <strong>J-4 à J-3</strong> : révision ciblée des faiblesses identifiées · <strong>J-2</strong> : révision légère, connecteurs, formules · <strong>J-1</strong> : activité de détente, lecture plaisir, pas de stress · <strong>Jour J</strong> : confiance, technique, calme.'},
      {h:'📝 Mémo — 10 réflexes à automatiser',p:'① Toujours lire les questions avant le texte/l\'audio ② Jamais de conditionnel après "si" ③ Accord du participe passé avec avoir = COD avant ④ "Bien que" = subjonctif ⑤ Formule de politesse = obligatoire en EE ⑥ Structure IMC à l\'oral ⑦ Synonymes pour éviter les répétitions ⑧ Pas de réponse vide ⑨ Révision 3 passes à l\'écrit ⑩ Reformuler si on ne comprend pas la question orale.'}
    ]},
    // Module 13 — Simulations et Examens Blancs
    { desc:'Reproduisez les conditions exactes du TEF & TCF Canada et analysez vos performances.', blocks:[
      {h:'🎯 Objectif du module',p:'Ce module vous place en conditions réelles d\'examen : simulations chronométrées, notation automatique et analyse détaillée de vos performances par compétence. L\'entraînement en conditions réelles est la méthode la plus efficace pour progresser dans les dernières semaines.'},
      {h:'📊 Format des simulations ARCADINS',p:'Chaque simulation reproduit le format du TEF & TCF Canada : <strong>CO</strong> : 30-40 questions sur documents audio simulés · <strong>CE</strong> : 40-50 questions sur textes variés · <strong>EE</strong> : 2 tâches (lettre formelle + argumentatif) · <strong>EO</strong> : prompts de préparation + grille d\'auto-évaluation. Score global converti en NCLC estimé.'},
      {h:'📈 Analyse des résultats — Comment lire vos scores',p:'Après chaque simulation : <strong>Score ≥ 85 %</strong> → compétence solide, maintenez · <strong>Score 70-84 %</strong> → compétence suffisante, améliorez les points faibles identifiés · <strong>Score 50-69 %</strong> → compétence fragile, révision approfondie nécessaire · <strong>Score < 50 %</strong> → retournez aux modules théoriques correspondants.'},
      {h:'🔄 Stratégie de simulation progressive',p:'<strong>Semaine 1</strong> : simulation partielle (CO seulement, 20 min) · <strong>Semaine 2</strong> : simulation partielle (CE seulement, 30 min) · <strong>Semaine 3</strong> : simulation complète EE (60 min) · <strong>Semaine 4</strong> : simulation complète 4 compétences (3h30) · Répétez la simulation complète jusqu\'à 3 fois, en notant vos progrès.'},
      {h:'💡 Tirer le maximum des corrections',p:'Après chaque simulation : ① Notez chaque erreur dans un carnet ② Identifiez si l\'erreur est de grammaire, vocabulaire, compréhension ou stratégie ③ Trouvez la règle correspondante ④ Créez 3 exemples personnels utilisant la règle ⑤ Revoyez vos erreurs après 48 heures puis après 7 jours (révision espacée).'},
      {h:'📝 Mémo — 5 indicateurs de préparation optimale',p:'① Vos scores en CO dépassent régulièrement 80 % ② Vos textes EE dépassent le nombre de mots requis avec qualité ③ Vous ne bloquez plus sur les questions de grammaire courante ④ Votre temps de réponse à l\'oral est de 2-3 minutes sans interruption ⑤ Votre score NCLC estimé dépasse d\'au moins 1 niveau votre objectif (marge de sécurité).'}
    ]},
    // Module 14 — Révision Générale et Stratégies Finales
    { desc:'Consolidez l\'ensemble de votre préparation et préparez-vous à exceller le jour J.', blocks:[
      {h:'🏆 Objectif final',p:'Ce dernier module est votre phase de consolidation et de finalisation. Vous avez parcouru 13 modules de contenu théorique et pratique. Il s\'agit maintenant de synthétiser vos acquis, d\'identifier vos dernières lacunes et d\'optimiser votre stratégie pour le jour de l\'examen.'},
      {h:'📋 Bilan de compétences personnalisé',p:'Avant ce module, consultez vos scores à tous les quiz précédents. Identifiez vos 2 compétences les plus faibles et consacrez 70 % de votre temps de révision à ces compétences. Maintenez vos compétences fortes avec 15-20 minutes de pratique quotidienne.'},
      {h:'🔑 Révision des incontournables',p:'<strong>Grammaire</strong> : subjonctif (déclencheurs), conditionnel (hypothèse), accord participe passé · <strong>Vocabulaire</strong> : immigration (30 termes IRCC), connecteurs logiques (20 minimum), formules épistolaires · <strong>Stratégies</strong> : lecture des questions avant le texte/audio, structure IMC à l\'oral, plan thèse/antithèse/synthèse à l\'écrit.'},
      {h:'🧘 Préparation mentale — Les 7 jours avant l\'examen',p:'<strong>J-7 à J-4</strong> : révision active et simulations · <strong>J-3</strong> : révision légère des fiches synthèse · <strong>J-2</strong> : activité plaisir (film en français, lecture) · <strong>J-1</strong> : repos, pas de révision intense, préparez vos affaires · <strong>Jour J</strong> : arrivez en avance, respirez profondément, faites confiance à votre préparation.'},
      {h:'🎖️ Votre certificat ARCADINS',p:'Après réussite du test final de cette plateforme, votre certificat ARCADINS de parcours d\'entraînement est généré automatiquement. Il atteste de votre engagement dans ce parcours pédagogique complet de préparation selon les standards généralement attendus au TEF & TCF Canada. Il peut compléter votre dossier de candidature.'},
      {h:'📝 Message final',p:'Votre préparation sur cette plateforme représente un investissement réel dans votre projet d\'immigration. Le TEF & TCF Canada est un défi linguistique sérieux, mais avec une méthodologie rigoureuse, une pratique régulière et une gestion efficace du stress, l\'objectif NCLC 7+ est tout à fait accessible. Vous avez les outils. Faites confiance à votre parcours.'}
    ]}
  ],
  en: [
    { desc:'Understand how the exams work and assess your starting level.', blocks:[
      {h:'📊 Learning Objectives',p:'This foundational module helps you understand how TEF Canada and TCF Canada work, establish your starting NCLC profile, and plan your training path according to your immigration goal.'},
      {h:'🎯 The 4 Assessed Skills',p:'TEF & TCF Canada evaluates 4 skills: Listening Comprehension (LC), Reading Comprehension (RC), Oral Expression (OE) and Written Expression (WE). Each skill yields an NCLC score from 1 to 12.'},
      {h:'📋 NCLC vs CEFR — Key Correspondences',p:'NCLC 4 ≈ A2 · NCLC 5-6 ≈ B1 · NCLC 7 ≈ B2 · NCLC 9 ≈ C1. For Express Entry, the language bonus starts at NCLC 7 and is maximized at NCLC 9+.'},
      {h:'🏛️ TEF Canada vs TCF Canada — Comparison Sheet',p:'Both exams are <strong>recognized by IRCC</strong> and assess the <strong>same 4 skills</strong> at the <strong>same NCLC levels</strong>. You take <strong>one OR the other</strong>, never both. Only the format and scoring differ:',
        table:`<div class="cmp-wrap"><table class="cmp-table">
          <thead><tr><th>Criterion</th><th class="cmp-tef">🔵 TEF Canada</th><th class="cmp-tcf">🟢 TCF Canada</th></tr></thead>
          <tbody>
            <tr><td>Administered by</td><td>CCIP (Paris Chamber of Commerce)</td><td>France Éducation International</td></tr>
            <tr><td>Scoring</td><td>Points (e.g. 0–450 per section)</td><td>Levels A1 → C2</td></tr>
            <tr><td>Skills</td><td>LC · RC · OE · WE</td><td>LC · RC · OE · WE</td></tr>
            <tr><td>Listening</td><td>~40 questions · ~40 min</td><td>~29 questions · ~35 min</td></tr>
            <tr><td>Reading</td><td>~50 questions · ~60 min</td><td>~29 questions · ~60 min</td></tr>
            <tr><td>Writing</td><td>2 tasks · ~60 min</td><td>3 tasks · ~60 min</td></tr>
            <tr><td>Speaking</td><td>2 sections · ~15 min</td><td>2 tasks · ~12 min</td></tr>
            <tr><td>Result validity</td><td>2 years</td><td>2 years</td></tr>
            <tr><td>IRCC recognition</td><td>✅ Yes (Express Entry, PSTQ…)</td><td>✅ Yes (Express Entry, PSTQ…)</td></tr>
          </tbody></table></div>
          <p style="margin-top:12px;font-size:.85rem;color:var(--gray-text);">💡 <strong>Which one to choose?</strong> Both lead to the same NCLC result. Choose based on <strong>test centres available near you</strong> and <strong>dates</strong>. Figures above are indicative — always verify the current format on the official websites before registering.</p>`},
      {h:'⚠️ Common Mistakes to Avoid',p:'Do not underestimate oral expression — it takes the longest to improve. Do not target only NCLC 7: reaching NCLC 9 can add 50+ CRS points. Plan at least 8-12 weeks of serious preparation.'},
      {h:'🗓️ Organization Tips',p:'Plan your training over 8-14 weeks. Allocate 45-60 minutes per day, 5 days per week. Start by identifying your 2 weakest skills and dedicate 60% of your time to them.'}
    ]},
    { desc:'Develop your listening strategies and master audio document types.', blocks:[
      {h:'🎧 Target Skills',p:'This module targets NCLC 5 to 7 (B1-B2) in listening comprehension. You will learn to identify essential information in everyday conversations, public announcements, and news bulletins.'},
      {h:'📻 Document Types in TEF & TCF Canada',p:'Dialogues (colleagues, neighbors, customer/seller) · Announcements (transport, public places) · Weather forecasts · Phone messages · Short radio broadcasts. Level: A2 to B2 for this module.'},
      {h:'🔑 Strategy: The 3 Mental Listenings',p:'1st: identify the context (who speaks? where? about what?). 2nd: spot the information required by the questions. During: do not transcribe everything — only note keywords, numbers and proper nouns.'},
      {h:'⚙️ Time Management',p:'Read questions BEFORE listening. Answer WHILE listening, not after. If you miss an answer, move on — never get stuck. Use the 8-10 seconds between questions to read the next one.'},
      {h:'🇨🇦 Quebec Accent — Key Features',p:'TCF Canada may include Quebec-accented speakers. Features: diphthongs (moi → "moé"), affrication (ti, di), specific vocabulary (char = car, dépanneur = convenience store, courriel = email). Listen to Radio-Canada regularly.'},
      {h:'📝 Key Takeaways — 5 Points',p:'① Always read questions before listening ② Target keywords, not details ③ Never get stuck on a missed question ④ Traps often involve numbers (dates, times, prices) ⑤ Quebec accent is authentic French, not an error.'}
    ]},
    { desc:'Structure your oral responses and build fluency.', blocks:[
      {h:'🎤 Target Skills',p:'This module prepares you for oral tasks at NCLC 5 to 7 (B1-B2): guided interaction (role play), prepared monologue, and short Q&A on everyday topics.'},
      {h:'🗺️ Structure of an Effective Oral Response',p:'Every oral response should follow the IMC structure: Introduction (state your point of view in 1-2 sentences), Message (develop with 2 arguments + examples), Conclusion (summarize in 1 sentence).'},
      {h:'🔗 Essential Oral Connectors (B1-B2)',p:'Introduction: "Je vais vous parler de…" · Addition: "De plus", "Par ailleurs" · Opposition: "Cependant", "Néanmoins" · Conclusion: "En résumé", "Pour conclure".'},
      {h:'🎙️ Common Exam Traps',p:'① Not answering the question asked (off-topic) ② Speaking too fast due to stress ③ Repeating the same words ④ Stopping and saying "I don\'t know" ⑤ Ignoring the intro/development/conclusion structure.'},
      {h:'💬 Frequent Communication Situations',p:'Daily life: housing, transport, shopping, medical appointments. Work: job interview, meeting, leave request. Immigration: explaining your project, describing your background.'},
      {h:'📝 Key Phrases to Memorize',p:'"À mon avis…" · "Il me semble que…" · "Je suis convaincu(e) que…" · "Certes… mais…" · "En ce qui me concerne…" · "En guise de conclusion…"'}
    ]},
    { desc:'Master reading of everyday texts and build your functional vocabulary.', blocks:[
      {h:'📖 Target Skills',p:'This module targets NCLC 5 to 7 (B1-B2) in reading comprehension. You will learn to read and understand everyday texts: ads, messages, instructions, short news articles, administrative forms.'},
      {h:'📄 Text Types — Level 1',p:'Functional texts: classified ads, menus, schedules, posters · Short informational texts: blog articles, FAQs, brochures · Informal messages and emails · Simple forms: housing application, registration.'},
      {h:'⚡ Speed Reading Techniques',p:'Skimming: scan the text in 30 seconds to grasp the general theme. Scanning: search for a specific word, date, or number. Selective reading: only read in detail paragraphs linked to questions.'},
      {h:'🇨🇦 Canadian Vocabulary — Essential Terms',p:'Administration: SIN (Social Insurance Number), T4 (employment record), CPE (childcare center), CLSC (community health center). Daily life: dépanneur, courriel, stationnement, magasinage.'},
      {h:'⚠️ Common Traps in RC',p:'① Choosing an answer containing text words without understanding ② Confusing affirmed and negated information ③ Ignoring nuances ("sometimes", "rarely") ④ Answering from prior knowledge rather than the text.'},
      {h:'📝 4-Step Strategy',p:'Step 1: read the questions (30 sec) · Step 2: identify the text type · Step 3: read the text targeting answers · Step 4: re-read questions and verify. Time budget: max 1.5 minutes per question.'}
    ]},
    { desc:'Write structured formal texts meeting TEF & TCF Canada requirements.', blocks:[
      {h:'✍️ Target Skills',p:'This module prepares for Task 1 of written expression (formal letter/email, 120-150 words) and introduces the basics of Task 2. Target level: NCLC 5 to 7 (B1-B2).'},
      {h:'📧 Formal Email Structure — Complete Guide',p:'1. Subject: summarize in 5-8 words · 2. Salutation: "Madame," or "Monsieur," (with comma) · 3. Body: introduction → development → request or conclusion · 4. Closing: "Veuillez agréer, Madame, l\'expression de mes salutations distinguées." · 5. Signature.'},
      {h:'🔑 Epistolary Politeness Vocabulary',p:'Opening: "J\'ai l\'honneur de vous soumettre…" · Body: "Je souhaiterais obtenir des informations concernant…" · Closing: "Dans l\'attente de votre réponse, je demeure à votre disposition."'},
      {h:'⚠️ The 10 Most Penalized Errors',p:'① Using "tu" instead of "vous" ② Forgetting the closing formula ③ Exceeding or not reaching the word count ④ Anglicisms ⑤ Repeating "je" at the start of consecutive sentences ⑥ No logical connectors ⑦ No specific subject line ⑧ Unbalanced salutation formula.'},
      {h:'📊 Official Evaluation Grid',p:'Written expression is graded on 4 criteria: Task adequacy · Coherence and cohesion · Lexical competence · Grammatical competence. Each criterion weighs ~25% of the grade.'},
      {h:'📝 Pre-submission Checklist',p:'✓ Word count respected (120-150) ✓ Formal "vous" used ✓ Closing formula complete ✓ At least 4 different connectors ✓ All instructions addressed ✓ Proofread for agreement and conjugation'}
    ]},
    { desc:'Master the fundamental grammatical structures of French for TEF & TCF Canada.', blocks:[
      {h:'📚 Prerequisites and Objectives',p:'This module consolidates the grammatical foundations needed to reach NCLC 6 to 8. We prioritize the structures most frequently tested and most often misused by candidates.'},
      {h:'⚙️ Essential Tenses — Targeted Review',p:'Passé composé: être or avoir? + agreements · Imparfait: habits, descriptions · Futur simple: irregular stems · Conditionnel: politeness + hypothesis · Subjonctif: after il faut que, bien que, pour que, douter que.'},
      {h:'🔴 The 15 Most Penalized Errors',p:'① Participe passé agreement with avoir (preceding COD) ② "Malgré que" (incorrect → "Bien que") ③ Conditional after "si" (never!) ④ Confusion ce/se, a/à ⑤ Misplaced negation in passé composé ⑥ False agreement with nearest noun.'},
      {h:'💡 Method for Memorizing Irregularities',p:'Group irregular verbs by families: -dre verbs (prendre, apprendre) → same conjugation. Type-2 -ir verbs (partir, sortir) → je pars, tu pars. Master auxiliaries être/avoir at all tenses first.'},
      {h:'📋 Subjonctif — Trigger Table',p:'Obligation: il faut que, il est essentiel que · Emotion: je suis content que, il est dommage que · Doubt: il est possible que, je doute que · Concession: bien que, quoique · Purpose: pour que, afin que · Condition: à condition que.'},
      {h:'📝 5 Golden Rules of French Grammar',p:'① Preceding COD with avoir → mandatory agreement ② Si + imparfait → conditionnel présent (NEVER si + conditionnel) ③ Bien que, quoique, pour que → ALWAYS subjonctif ④ After espérer, croire, penser (affirmative) → indicatif ⑤ Gérondif (en + participe présent) = same subject as main verb.'}
    ]},
    { desc:'Enrich your vocabulary in immigration, work, and Canadian life domains.', blocks:[
      {h:'🗺️ Advanced Immigration Vocabulary',p:'Procedures: file/constitute a dossier · submit a request · obtain an invitation (ITA) · meet admissibility criteria · appeal a decision. Documents: apostilled birth certificate · criminal record check · foreign credential evaluation (FCE).'},
      {h:'💼 Professional Vocabulary — Canadian Context',p:'Resume: transferable skills, quantified accomplishments, references · Interview: highlight experience, demonstrate added value, negotiate compensation · Workplace: volunteering, remote work, benefits package.'},
      {h:'🏥 Health and Social Services Vocabulary',p:'Health insurance card (RAMQ in Quebec) · family doctor / GP · CLSC (community health center) · waiting list · emergency care · prescription · generic medication · supplemental drug insurance.'},
      {h:'🏠 Housing Vocabulary in Canada',p:'Apartment / unit / rent · lease (12-month standard) · Rental Board (TAL in Quebec) · security deposit · utilities included/excluded · condo vs housing cooperative · pre-purchase inspection · mortgage / down payment.'},
      {h:'🎓 Education and Training Vocabulary',p:'CEGEP (pre-university college — Quebec only) · AEC · DEC · DEP · diploma equivalency · recognition of prior learning (RPL) · continuing education · scholarship.'},
      {h:'📝 30 Useful Verbs for TEF & TCF',p:'Solliciter · octroyer · soumettre · valider · attester · justifier · accréditer · mandater · renouveler · prolonger · résilier · annuler · confirmer · notifier · aviser · renseigner · consulter · se conformer · bénéficier · s\'acquitter · contester · revendiquer · exercer ses droits · prendre acte · donner suite.'}
    ]},
    { desc:'Master complex audio documents and reach NCLC 8 to 10.', blocks:[
      {h:'🎧 Target Skills',p:'This module targets NCLC 8 to 10 (B2+ to C1) in listening comprehension. You will learn to understand complex audio documents: debates, conferences, expert interviews and news reports.'},
      {h:'📡 Document Types — Advanced Level',p:'Interviews and discussions (experts, researchers) · Debates and roundtables (multiple voices, contradictory opinions) · Journalistic reports (Radio-Canada, Le Devoir) · Conferences and presentations (academic register). Duration: 1m30s to 3 minutes.'},
      {h:'🔬 Advanced Listening Strategies',p:'① Identify the register from the first seconds ② Distinguish facts, opinions, and hypotheses ③ Notice implicit meaning and innuendo ④ Watch for hedging markers ("il semblerait que", "selon certains") ⑤ Note numbers, dates, and statistics.'},
      {h:'🇨🇦 Quebec Context — Advanced Expressions',p:'Media to listen to: Radio-Canada (ICI Première), CIBL 101.5 FM · Common expressions: "C\'est le boutte" (it\'s great), "pogner" (to catch/become popular), "pantoute" (not at all), "maganer" (to damage).'},
      {h:'⚠️ Traps in Long Documents',p:'① First information is not always most important — stay attentive until the end ② A speaker may cite a viewpoint they do not share ③ Comparisons are frequently tested ④ A debate\'s conclusion differs from participants\' individual opinions.'},
      {h:'📝 Level 2 Progress Plan',p:'Weeks 1-2: daily 15-min Radio-Canada listens without subtitles · Weeks 3-4: exercises with transcripts — compare understanding to transcript · Weeks 5-6: timed simulations on 2-3 min documents · Goal: 85% correct on B2+ documents.'}
    ]},
    { desc:'Achieve oral excellence with structured C1-level arguments.', blocks:[
      {h:'🎤 Target Skills',p:'This module prepares for oral tasks at NCLC 8 to 10 (B2+-C1): developed argumentation, contradictory debate, nuanced position-taking, and interaction with an examiner.'},
      {h:'🏛️ C1-Level Argumentation Structure',p:'Introduction (30s): rephrase topic + announce plan · Thesis (1 min): main argument + concrete example · Antithesis (1 min): opposing argument + rebuttal · Synthesis (30s): nuanced position + opening · Conclusion (15s): memorable closing statement.'},
      {h:'💎 High-Register Vocabulary — NCLC 9-10',p:'To affirm: "Force est de constater que…" · "Il est indéniable que…" · To qualify: "Certes… mais il n\'en demeure pas moins que…" · "Il serait réducteur de prétendre que…" · To conclude: "En définitive…" · "Au final, il appert que…"'},
      {h:'🔄 Concession — Advanced Technique',p:'Concession is the most valued marker of intellectual maturity in oral production. Structure: "Certes + [acknowledged opposing argument], but/however + [rebuttal or nuance]".'},
      {h:'🎙️ Handling Unexpected Situations',p:'If you don\'t understand the question: "Pourriez-vous reformuler votre question?" · If you\'re searching for words: "Comment dire…" / "Pour m\'exprimer autrement…" · Absolutely avoid: "Je ne sais pas", long silences, repetitive loops.'},
      {h:'📝 Frequent Oral Topics in TEF/TCF',p:'Immigration and integration · Bilingualism and official languages · Remote work and new technologies · Environment and sustainable development · Quebec/Canadian education system · Public health · Social media · Globalization and cultural identity.'}
    ]},
    { desc:'Analyze complex texts and develop in-depth reading comprehension.', blocks:[
      {h:'📖 Target Skills',p:'This module targets NCLC 8 to 10 (B2+ to C1) in reading comprehension. You will learn to analyze complex texts: in-depth articles, editorials, academic texts, legal documents, and official IRCC materials.'},
      {h:'📰 Text Types — Advanced Level',p:'Opinion articles and editorials · Academic and scientific texts · Simplified legal documents (contracts, leases) · Complex argumentative texts · Official IRCC documents (guides, policies). These texts require analytical, non-linear reading.'},
      {h:'🔬 Analytical Reading — 5 Steps',p:'① Identification: text type, author, source, date · ② Thesis: what position is being defended? · ③ Arguments: what are the 2-3 main arguments? · ④ Implicit: what is suggested without being stated? · ⑤ Tone: formal/informal, neutral/engaged, objective/subjective.'},
      {h:'🧩 Complex Text Vocabulary',p:'Implicit markers: "il est à noter que", "il convient de rappeler que" · Hedging: "il semblerait que", "selon certains" · Emphasis: "c\'est précisément", "il ne fait aucun doute que".'},
      {h:'⚠️ C1-Level Text Traps',p:'① Questions often test implicit understanding and nuances ② Watch for partially true distractors ③ Text source indicates expected register ④ Argumentative text may present opposing views without endorsing them ⑤ "According to the author" ≠ "according to studies" ≠ "according to the narrator".'},
      {h:'📝 High-Level Connector Vocabulary',p:'Cause: attendu que, en raison de, du fait de · Consequence: d\'où, il s\'ensuit que, il en résulte que · Concession: nonobstant, en dépit de, quand bien même · Addition: qui plus est, de surcroît, voire, a fortiori.'}
    ]},
    { desc:'Write C1-level argumentative texts with mastery and stylistic precision.', blocks:[
      {h:'✍️ Target Skills',p:'This module prepares for Task 2 of written expression (200-250 words, argumentative text) at NCLC 8 to 10 (B2+-C1). It targets stylistic mastery, lexical richness, and argumentative rigor.'},
      {h:'📐 Advanced Argumentative Text Structure',p:'Introduction: hook (fact, question, quote) → context → stated thesis · Development: ¶1 (argument 1 + example + mini-conclusion) · ¶2 (argument 2 + example + mini-conclusion) · ¶3 (concession + rebuttal) · Conclusion: synthesis + opening.'},
      {h:'💎 Elevated Vocabulary — Integrate into Your Writing',p:'Academic verbs: démontrer, attester, corroborer, étayer, nuancer, appréhender · Nouns: l\'enjeu, la problématique, la dichotomie · Phrases: force est de constater, à cet égard, dans cette optique, en l\'occurrence.'},
      {h:'🔴 Errors That Drop You from NCLC 8 to 6',p:'① Repeating the same word 3+ times in a paragraph ② Starting consecutive sentences with "Je" ③ Uncorrected anglicisms ④ Unbalanced paragraphs ⑤ No transition between paragraphs ⑥ Introduction too long, conclusion rushed ⑦ Failing to take a clear position.'},
      {h:'✅ 3-Pass Revision Guide',p:'Pass 1 — Content: does it answer the prompt? is the thesis clear? are arguments supported? · Pass 2 — Form: 6+ different connectors? varied vocabulary? · Pass 3 — Language: agreements, conjugations, punctuation. Budget: 5 minutes revision time.'},
      {h:'📝 Frequent Written Topics in TEF/TCF',p:'Technology and privacy · Immigration and integration · Ecology and sustainable lifestyles · Distance learning · Social media and youth · Work and personal fulfillment · Economic globalization · Bilingualism and identity · Public health.'}
    ]},
    { desc:'Master time management techniques and strategies for each exam task.', blocks:[
      {h:'⏱️ Time Management — The 4 Tasks',p:'LC (~40 min): 1-1.5 min/question → read before, answer during · RC (~60 min): 90 sec/question → skim then targeted reading · WE (~60 min): 5 min planning + 45 min writing + 10 min revision · OE (~15 min): 30-60 sec prep + 2-4 min response.'},
      {h:'🧠 Exam Psychology — Staying Sharp',p:'① Evening before: no intensive study — light activity, adequate sleep ② Morning: protein breakfast, arrive 30 minutes early ③ In the room: if stuck, mark and move on ④ Never change an answer without a specific reason ⑤ Your first instinct is often correct.'},
      {h:'🎯 4-Elimination Technique (MCQ)',p:'① Eliminate clearly wrong answers (usually 2 remain) ② Spot "almost right" answers (with one wrong word) ③ Beware of answers that seem too obvious ④ The most precise and nuanced answer is usually correct ⑤ NEVER leave a blank — no penalty for wrong answers.'},
      {h:'📋 D-7 Checklist Before the Exam',p:'✓ Complete timed simulation ✓ Review logical connectors and epistolary formulas ✓ Review recurring grammar errors ✓ Prepare 3-4 concrete examples on frequent opinion topics ✓ Confirm time and location ✓ Prepare required documents (ID, registration).'},
      {h:'🔁 Last Week Study Plan',p:'D-7 to D-5: full simulation + thorough correction · D-4 to D-3: targeted review of identified weaknesses · D-2: light review, connectors, formulas · D-1: relaxing activity, pleasure reading, no stress · Day D: confidence, technique, calm.'},
      {h:'📝 10 Reflexes to Automate',p:'① Always read questions before text/audio ② Never conditional after "si" ③ Participe passé with avoir = preceding COD ④ "Bien que" = subjonctif ⑤ Closing formula mandatory in WE ⑥ IMC structure for OE ⑦ Synonyms to avoid repetition ⑧ No blank answers ⑨ 3-pass revision for WE ⑩ Rephrase if oral question is unclear.'}
    ]},
    { desc:'Reproduce exact TEF & TCF Canada conditions and analyze your performance.', blocks:[
      {h:'🎯 Module Goal',p:'This module places you in real exam conditions: timed simulations, automatic scoring, and detailed performance analysis by skill. Training in real conditions is the most effective method for progressing in the final weeks.'},
      {h:'📊 ARCADINS Simulation Format',p:'Each simulation reproduces the TEF & TCF Canada format: LC: 30-40 questions on simulated audio documents · RC: 40-50 questions on varied texts · WE: 2 tasks (formal letter + argumentative text) · OE: preparation prompts + self-evaluation grid.'},
      {h:'📈 Results Analysis — Reading Your Scores',p:'≥85%: solid skill, maintain · 70-84%: sufficient, improve identified weak points · 50-69%: fragile, in-depth review needed · <50%: return to corresponding theory modules.'},
      {h:'🔄 Progressive Simulation Strategy',p:'Week 1: partial simulation (LC only, 20 min) · Week 2: partial simulation (RC only, 30 min) · Week 3: full WE simulation (60 min) · Week 4: complete 4-skill simulation (3h30) · Repeat complete simulation up to 3 times, tracking progress.'},
      {h:'💡 Maximizing Corrections',p:'After each simulation: ① note each error in a notebook ② identify if grammar, vocabulary, comprehension, or strategy error ③ find the corresponding rule ④ create 3 personal examples ⑤ review errors after 48 hours then 7 days (spaced repetition).'},
      {h:'📝 5 Signs of Optimal Preparation',p:'① Your LC scores regularly exceed 80% ② Your WE texts exceed required word count with quality ③ You no longer get stuck on standard grammar questions ④ Your oral response time is 2-3 minutes without interruption ⑤ Your estimated NCLC score exceeds your target by at least 1 level.'}
    ]},
    { desc:'Consolidate your entire preparation and prepare to excel on exam day.', blocks:[

// ── Notes personnelles (localStorage) ────────────────────────────────────────
function getNoteKey(num) { return `arc_module_note_${num}`; }

function renderNotesZone(num) {
  const saved = localStorage.getItem(getNoteKey(num)) || '';
  return `<details class="notes-zone" ${saved ? 'open' : ''}>
    <summary>Mes notes personnelles — Module ${num} <span style="font-size:.72rem;font-weight:400;opacity:.6;">(sauvegardées localement)</span></summary>
    <textarea class="notes-textarea" id="noteArea_${num}"
      placeholder="Prenez vos notes ici : vocabulaire retenu, points à revoir, questions à poser…"
      oninput="scheduleNoteSave(${num})">${saved}</textarea>
    <div class="notes-saved" id="noteSaved_${num}"></div>
  </details>`;
}

let _noteSaveTimer = null;
function scheduleNoteSave(num) {
  clearTimeout(_noteSaveTimer);
  _noteSaveTimer = setTimeout(() => {
    const ta = document.getElementById(`noteArea_${num}`);
    if (!ta) return;
    localStorage.setItem(getNoteKey(num), ta.value);
    const el = document.getElementById(`noteSaved_${num}`);
    if (el) { el.textContent = '✓ Sauvegardé'; setTimeout(() => { if(el) el.textContent = ''; }, 2000); }
  }, 800);
}
