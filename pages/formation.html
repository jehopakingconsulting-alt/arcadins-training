Rédigez une lettre de motivation formelle de 180-200 mots adressée au Ministère de l'Immigration, de la Francisation et de l'Intégration (MIFI) du Québec pour expliquer :
• Votre parcours linguistique (apprentissage du français, niveau actuel)
• Votre motivation à vous établir au Québec
• Votre capacité à vous intégrer rapidement à la société québécoise

📌 Cet exercice mobilise toutes les compétences de l'expression écrite :
vocabulaire de l'immigration · registre formel · connecteurs · grammaire ·
structure épistolaire · argumentation.`,
    rubric: [
      'Mon texte fait entre 180 et 200 mots',
      'J\'ai utilisé la structure épistolaire complète (salutation, corps, formule finale)',
      'J\'ai répondu aux 3 consignes dans l\'ordre demandé',
      'J\'ai utilisé au moins 8 connecteurs différents',
      'Mon vocabulaire est de niveau C1 (varié, précis, sans anglicismes)',
      'Mon texte est grammaticalement irréprochable (accords, conjugaisons)',
    ],
  },
};

let modules = [], currentModuleNum = 1;

async function init() {
  const token = getToken();
  if (!token) { window.location.href = 'acces.html'; return; }
  try {
    const me = await AuthAPI.me();
    const user = me.user;
    // Le personnel (admin / modérateur) accède librement au contenu, sans tunnel de paiement.
    const isStaff = user.role === 'admin' || user.role === 'moderator';
    if (!isStaff) {
      if (user.access_expired) { window.location.href = 'forfaits.html?expired=1'; return; }
      if (!user.qualification_done) { window.location.href = 'qualification.html'; return; }
    }
    if (user.nom || user.prenom) document.getElementById('userDisplayName').textContent = (user.prenom||'') + ' ' + (user.nom||'');

    await loadModules();
    if (user.all_modules_done) {
      document.getElementById('allDonePanel').style.display = 'block';
      document.getElementById('moduleContent').style.display = 'none';
      document.getElementById('completedBadge').style.display = 'inline-flex';
    }
  } catch(e) {
    document.getElementById('moduleContent').innerHTML = `<p style="color:red">${e.message}</p>`;
  }
}

async function loadModules() {
  const res = await ModulesAPI.status();
  modules = (res.data || res).modules || res.modules;
  renderSidebar();
  const firstAvail = modules.find(m => m.status !== 'locked') || modules[0];
  if (firstAvail) showModule(firstAvail.module_number);
  updateProgress();
}

function renderSidebar() {
  const lang = typeof currentLang !== 'undefined' ? currentLang : 'fr';
  const names = MODULE_NAMES[lang];
  const statLabels = { fr:{locked:'Verrouillé',not_started:'Non commencé',in_progress:'En cours',completed:'Terminé'}, en:{locked:'Locked',not_started:'Not started',in_progress:'In progress',completed:'Completed'} };
  document.getElementById('moduleList').innerHTML = modules.map((m,i) => `
    <div class="module-item status-${m.status} ${m.module_number===currentModuleNum?'active':''} ${m.status==='locked'?'locked':''}"
         onclick="${m.status!=='locked'?`showModule(${m.module_number})`:''}">
      <div class="module-num">${m.status==='completed'?'✓':MODULE_ICONS[i]||m.module_number}</div>
      <div class="module-info">
        <div class="module-name">${names[i]||'Module '+m.module_number}</div>
        <div class="module-status-label">${statLabels[lang][m.status]||m.status}</div>
      </div>
    </div>`).join('');
}

function updateProgress() {
  const done = modules.filter(m=>m.status==='completed').length;
  const total = modules.length;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('statDone').textContent = done;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statPct').textContent = pct+'%';
}

async function showModule(num) {
  currentModuleNum = num;
  const lang = typeof currentLang !== 'undefined' ? currentLang : 'fr';
  const names = MODULE_NAMES[lang];
  const mod = modules.find(m=>m.module_number===num);
  if (!mod) return;
  if (mod.status === 'locked') return;

  renderSidebar();

  const idx = num - 1;
  const content = MODULE_CONTENT[lang][idx] || MODULE_CONTENT.fr[idx] || {};
  const blocks = content.blocks || [];
  const isCompleted = mod.status === 'completed';

  let html = `
    <h2>${MODULE_ICONS[idx]} ${names[idx]||'Module '+num}</h2>
    <p class="module-desc">${content.desc||''}</p>`;

  if (isCompleted) {
    html += `<div class="completed-badge">✅ <span>${lang==='fr'?'Module terminé':'Module completed'}</span></div>`;
  }

  html += `<div class="content-blocks">` + blocks.map(b=>`
    <div class="content-block">
      <h4>${b.h}</h4>
      ${b.p ? `<p>${b.p}</p>` : ''}
      ${b.table || ''}
    </div>`).join('') + `</div>`;

  // Audio placeholder pour modules Compréhension Orale (2 & 8)
  if (AUDIO_DATA[num] && mod.status === 'in_progress') {
    html += renderAudioPlaceholder(num);
  }

  if (!isCompleted && mod.status !== 'locked') {
    if (mod.status === 'not_started') {
      html += `<button class="btn-primary" onclick="startModule(${num})">▶ Commencer ce module</button>`;
    } else {
      // Zone de pratique EO/EE (modules 3, 5, 9, 11)
      if (PRACTICE_DATA[num]) {
        html += renderPracticeZone(num);
      }
      // Module en cours → proposer le test
      const testInfo = mod.test_passed
        ? `<span style="color:#2e7d32;font-weight:700;">✅ Test réussi (${mod.test_score}%)</span>`
        : (mod.test_attempts ? `<span style="color:#e65100;">Tentative(s) : ${mod.test_attempts} — Meilleur score : ${mod.test_score}%</span>` : '');
      html += `<div style="background:linear-gradient(135deg,#f0f4ff,#e8f5ff);border:2px solid var(--blue);border-radius:14px;padding:24px;margin-top:16px;">
        <h3 style="color:var(--blue-dark);margin:0 0 8px;">🎯 Test de validation du module</h3>
        <p style="color:var(--gray-text);margin:0 0 16px;font-size:.9rem;">Répondez aux 10 questions pour valider ce module et débloquer le suivant. Score minimum requis : <strong>70%</strong>.</p>
        ${testInfo ? `<p style="margin:0 0 16px;">${testInfo}</p>` : ''}
        <button class="btn-primary" onclick="openModuleTest(${num})">📝 Passer le test du module</button>
      </div>`;
    }
  } else if (isCompleted) {
    const next = modules.find(m=>m.module_number===num+1);
    if (next && next.status !== 'locked') {
      html += `<button class="btn-primary" onclick="showModule(${num+1})" style="margin-top:8px;">Module suivant →</button>`;
    } else if (num === 14) {
      html += `<div style="text-align:center;margin-top:20px;"><a href="test-final.html" class="btn-primary">🏆 Passer le test final →</a></div>`;
    }
  }

  // Notes personnelles — disponibles sur tous les modules non verrouillés
  html += renderNotesZone(num);

  document.getElementById('moduleContent').innerHTML = html;
  if (typeof applyTranslations === 'function') applyTranslations();
}

async function startModule(num) {
  try {
    await ModulesAPI.start(num);
    const mod = modules.find(m=>m.module_number===num);
    if (mod) mod.status = 'in_progress';
    showModule(num);
    renderSidebar();
  } catch(e) { alert(e.message); }
}

async function completeModule(num) {
  // Désactivé — la validation se fait maintenant via le test
  alert('Veuillez passer le test du module pour valider votre progression.');
}

// ── Zone de pratique EO/EE ──────────────────────────────────────────────────

function renderPracticeZone(num) {
  const data = PRACTICE_DATA[num];
  if (!data) return '';

  const isEE = data.type === 'EE';

  const rubricItems = data.rubric.map((item, i) => `
    <div class="rubric-item">
      <input type="checkbox" class="rubric-check" id="rub_${num}_${i}">
      <label class="rubric-label" for="rub_${num}_${i}">${item}</label>
    </div>`).join('');

  const practiceArea = isEE ? `
    <textarea class="practice-textarea" id="practiceText_${num}"
      placeholder="Rédigez votre texte ici…"
      oninput="updateWordCount(${num})"></textarea>
    <div class="practice-wordcount" id="wordCount_${num}">0 mot(s)</div>` : `
    <div style="background:#f0f7f4;border-radius:10px;padding:14px 18px;font-size:.85rem;color:#2a5a3a;line-height:1.7;">
      💡 <strong>Astuce :</strong> Enregistrez-vous avec votre téléphone ou répétez à voix haute plusieurs fois. Réécouter votre production est la méthode la plus efficace pour progresser.
    </div>`;

  return `<div class="practice-zone">
    <div class="practice-zone-header">
      <h3>${data.title}</h3>
      <p>${data.subtitle}</p>
    </div>
    <div class="practice-zone-body">
      <div class="practice-prompt">${data.prompt.replace(/\n/g,'<br>')}</div>
      ${practiceArea}
      <div class="practice-rubric">
        <h4>✅ Grille d'auto-évaluation — cochez chaque critère atteint :</h4>
        <div class="${isEE ? '' : 'oral-checklist'}">${rubricItems}</div>
      </div>
    </div>
  </div>`;
}

function updateWordCount(num) {
  const ta = document.getElementById(`practiceText_${num}`);
  const wc = document.getElementById(`wordCount_${num}`);
  if (!ta || !wc) return;
  const count = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0;
  wc.textContent = `${count} mot(s)`;
  wc.style.color = count >= 120 && count <= 250 ? '#2e7d32' : count > 250 ? '#c62828' : '#aaa';
}

// ── TEST DE MODULE ──────────────────────────────────────────────────────────

let testAnswers  = {};   // { originalQuestionId: selectedOptionIndex }
let testQuestions = [];  // questions dans l'ordre reçu du serveur (déjà mélangées)
let testNum      = 0;
let testSubmitted = false;
let testTimerInterval = null;
const TEST_DURATION_SECONDS = 15 * 60; // 15 minutes

async function openModuleTest(num) {
  testNum = num;
  testAnswers = {};
  testSubmitted = false;
  clearTestTimer();
  const container = document.getElementById('moduleContent');
  container.innerHTML = `<div style="text-align:center;padding:40px;">⏳ Chargement du test...</div>`;
  try {
    const res = await ModulesAPI.getTest(num);
    const d = res.data || res;
    testQuestions = d.questions || [];
    renderTestPanel(d);
    startTestTimer();
  } catch(e) {
    container.innerHTML = `<p style="color:red;padding:20px;">${e.message}</p>`;
  }
}

function renderTestPanel(d) {
  const lang = typeof currentLang !== 'undefined' ? currentLang : 'fr';
  const names = MODULE_NAMES[lang];
  const idx = testNum - 1;

  let html = `<div class="test-panel">
    <div class="test-header">
      <h3>🎯 Test de validation — Module ${testNum}
        <span class="test-timer" id="testTimerDisplay">⏱ 15:00</span>
      </h3>
      <p>${names[idx]||''} · 10 questions · Score minimum : 70%</p>
    </div>
    <div class="test-body" id="testBody">`;

  // Les questions arrivent avec leur q.id (index original) — on l'utilise partout
  testQuestions.forEach((q, displayIdx) => {
    const qid = q.id; // index original côté serveur
    html += `<div class="test-question" id="tq_${qid}">
      <p class="q-text">${displayIdx + 1}. ${q.question}</p>
      <div class="test-options">
        ${q.options.map((opt, j) => `
          <button class="test-opt" id="opt_${qid}_${j}" onclick="selectOpt(${qid},${j})">${opt}</button>
        `).join('')}
      </div>
      <div class="test-explanation" id="expl_${qid}" style="display:none;"></div>
    </div>`;
  });

  html += `<div id="testResultBar" style="display:none;margin-top:20px;"></div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:24px;align-items:center;">
      <button class="btn-primary" id="submitTestBtn" onclick="submitModuleTest()" style="min-width:180px;">✅ Soumettre le test</button>
      <button onclick="cancelTest()" style="background:none;border:none;color:var(--blue);cursor:pointer;font-size:.88rem;text-decoration:underline;">← Retour au module</button>
    </div>
    </div></div>`;

  document.getElementById('moduleContent').innerHTML = html;
}

function cancelTest() {
  clearTestTimer();
  showModule(testNum);
}

function selectOpt(qid, optIdx) {
  if (testSubmitted) return;
  testAnswers[qid] = optIdx;
  for (let j = 0; j < 4; j++) {
    const btn = document.getElementById(`opt_${qid}_${j}`);
    if (btn) btn.classList.toggle('selected', j === optIdx);
  }
}

// ── Minuterie 15 min ─────────────────────────────────────────
function startTestTimer() {
  let remaining = TEST_DURATION_SECONDS;
  updateTimerDisplay(remaining);
  testTimerInterval = setInterval(() => {
    remaining--;
    updateTimerDisplay(remaining);
    if (remaining <= 0) {
      clearTestTimer();
      submitModuleTest(true); // auto-submit
    }
  }, 1000);
}

function clearTestTimer() {
  if (testTimerInterval) { clearInterval(testTimerInterval); testTimerInterval = null; }
}

function updateTimerDisplay(seconds) {
  const el = document.getElementById('testTimerDisplay');
  if (!el) return;
  const m = String(Math.floor(seconds / 60)).padStart(2, '0');
  const s = String(seconds % 60).padStart(2, '0');
  el.textContent = `⏱ ${m}:${s}`;
  if (seconds <= 60) el.classList.add('urgent');
  else el.classList.remove('urgent');
}

// ── Soumission ────────────────────────────────────────────────
async function submitModuleTest(autoSubmit = false) {
  if (testSubmitted) return;
  clearTestTimer();

  const answered = Object.keys(testAnswers).length;
  if (!autoSubmit && answered < testQuestions.length) {
    const missing = testQuestions.length - answered;
    if (!confirm(`Il vous reste ${missing} question(s) sans réponse. Soumettre quand même ?`)) {
      startTestTimer(); // reprendre le chrono si l'étudiant annule
      return;
    }
  }

  const btn = document.getElementById('submitTestBtn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Correction...'; }

  try {
    const res = await ModulesAPI.submitTest(testNum, testAnswers);
    const d = res.data || res;
    testSubmitted = true;

    // Afficher les corrections + explications
    (d.feedback || []).forEach(f => {
      // Marquer bonne/mauvaise réponse
      const correctBtn = document.getElementById(`opt_${f.id}_${f.correct_answer}`);
      if (correctBtn) correctBtn.classList.add('correct');
      if (!f.correct && f.given_answer !== null && f.given_answer !== undefined) {
        const givenBtn = document.getElementById(`opt_${f.id}_${f.given_answer}`);
        if (givenBtn) givenBtn.classList.add('wrong');
      }
      // Désactiver tous les boutons de cette question
      for (let j = 0; j < 4; j++) {
        const b = document.getElementById(`opt_${f.id}_${j}`);
        if (b) b.disabled = true;
      }
      // Afficher explication si mauvaise réponse
      if (!f.correct && f.explanation) {
        const expl = document.getElementById(`expl_${f.id}`);
        if (expl) {
          expl.textContent = `💡 ${f.explanation}`;
          expl.style.display = 'block';
        }
      }
    });

    // Barre de résultat
    const bar = document.getElementById('testResultBar');
    if (bar) {
      bar.style.display = 'block';
      bar.className = 'test-result-bar ' + (d.passed ? 'pass' : 'fail');
      bar.innerHTML = d.passed
        ? `🎉 Félicitations ! Score : <strong>${d.score}%</strong> (${d.correct}/${d.total}) — Module validé !`
        : `❌ Score : <strong>${d.score}%</strong> (${d.correct}/${d.total}) — Minimum requis : 70%. Réessayez dans 10 minutes.`;
      bar.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // Bouton d'action après résultat
    if (btn) {
      btn.disabled = false;
      if (d.passed) {
        if (d.all_done) {
          btn.textContent = '🏆 Passer le test final';
          btn.onclick = () => { window.location.href = 'test-final.html'; };
        } else {
          btn.textContent = `Module ${testNum + 1} →`;
          btn.onclick = () => afterTestPass(testNum);
        }
      } else {
        btn.textContent = '🔄 Recommencer le test (dans 10 min)';
        btn.onclick = () => openModuleTest(testNum);
      }
    }

    // Mettre à jour les données locales
    const mod = modules.find(m => m.module_number === testNum);
    if (mod) {
      mod.test_score    = d.score;
      mod.test_attempts = d.attempts;
      if (d.passed) {
        mod.test_passed = 1;
        mod.status = 'completed';
        const next = modules.find(m => m.module_number === testNum + 1);
        if (next && next.status === 'locked') next.status = 'not_started';
      }
    }
    renderSidebar();
    updateProgress();

    if (d.all_done) {
      setTimeout(() => {
        document.getElementById('moduleContent').style.display = 'none';
        document.getElementById('allDonePanel').style.display = 'block';
        document.getElementById('completedBadge').style.display = 'inline-flex';
      }, 3000);
    }
  } catch(e) {
    // Gérer le cooldown (429)
    if (btn) { btn.disabled = false; btn.textContent = '✅ Soumettre le test'; }
    const bar = document.getElementById('testResultBar');
    if (bar) {
      bar.style.display = 'block';
      bar.className = 'test-result-bar fail';
      bar.innerHTML = `⏳ ${e.message}`;
    } else {
      alert(e.message);
    }
  }
}

function afterTestPass(num) {
  const next = modules.find(m => m.module_number === num + 1);
  if (next) showModule(next.module_number);
}

// Re-render le contenu dynamique (sidebar + module courant) au changement de langue,
// car applyTranslations() ne touche que le texte statique data-i18n.
window.onLangChange = function() {
  if (!modules || !modules.length) return;
  renderSidebar();
  if (currentModuleNum) showModule(currentModuleNum);
};

document.addEventListener('DOMContentLoaded', init);
</script>
